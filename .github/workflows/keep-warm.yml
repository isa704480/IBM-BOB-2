# Pings the deployed app every 5 minutes so Render's free web service does not spin
# down (it sleeps after ~15 min of no traffic). One tiny HTTP call to /healthz.
#
# SETUP (after deploying to Render):
#   Repo → Settings → Secrets and variables → Actions → Variables → New variable
#     Name:  APP_URL
#     Value: https://<your-app>.onrender.com   (no trailing path)
#
# Until APP_URL is set, this job skips cleanly (green, no false failures).
# Note: GitHub disables scheduled workflows after 60 days without a commit.

name: keep-warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /healthz
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL repository variable not set yet — skipping keep-warm."
            echo "Set it at: Settings → Secrets and variables → Actions → Variables."
            exit 0
          fi
          # --max-time 90: a cold start is ~30-50 s; wait for the wake-up rather
          # than logging a false failure. --fail turns a 5xx into a non-zero exit.
          curl --fail --show-error --silent --max-time 90 --retry 2 --retry-delay 5 \
            "${APP_URL%/}/healthz" -o /dev/null -w "warmed: %{http_code} in %{time_total}s\n"
